services:
  redis: 
    image: redis:7
    ports: 
      - "127.0.0.1:6379:6379"
    command: ["redis-server","--appendonly","yes"]
    volumes: 
      - redisdata:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bidnow
      POSTGRES_PASSWORD: bidnow
      POSTGRES_DB: realtime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"

volumes:
  pgdata:
  redisdata: